<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf4eb">
  <meta name="description" content="揪愛買冷凍現貨專區｜快速查看門市現貨、分類、價格與商品資訊。">
  <title>揪愛買｜冷凍現貨專區</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="pageTop">
    <div class="brand">
      <img class="brand-logo" src="logo.jpg" alt="揪愛買官方 Logo" width="54" height="54">
      <div class="brand-copy"><h1>揪愛買</h1><p>冷凍現貨專區 <span class="brand-sparkle">✦ 現貨快速找</span></p></div>
    </div>
  </header>
  <main class="shell">
    <section class="intro" aria-label="網站介紹">
      <div><span class="intro-eyebrow">WELCOME TO JOINBUY</span><h2>今天想吃什麼？<span> ❄️</span></h2><p>冷凍現貨輕鬆找・喜歡的美味不用等</p></div>
      <div class="intro-decoration" aria-hidden="true">🛍️</div>
    </section>
    <!-- 第一階段保留原本後台單筆活動邏輯，第二階段才升級多活動輪播 -->
    <section id="activitySection" class="activity-card hidden" aria-label="最新活動">
      <div id="activityImageWrap" class="activity-image-wrap hidden"><img id="activityImage" class="activity-image" alt="活動圖片"></div>
      <div class="activity-main">
        <span id="activityBadge" class="activity-badge">🎉 最新活動</span>
        <h2 id="activityTitle">揪愛買活動專區</h2>
        <p id="activityDescription"></p>
        <div id="activityPeriod" class="activity-period hidden"></div>
        <button id="activityButton" class="activity-button hidden" type="button">查看活動商品</button>
      </div>
    </section>
    <section class="category-feature" aria-labelledby="quickCategoryTitle">
      <div class="section-title-row"><div><span class="section-kicker">EXPLORE</span><h2 id="quickCategoryTitle">✨ 快速找分類</h2></div><span class="section-aside">點選分類快速找商品</span></div>
      <div id="categoryIcons" class="category-icons" aria-label="商品快速分類"></div>
    </section>
    <section class="controls" id="productControls" aria-label="搜尋與篩選">
      <label class="search"><span class="search-symbol" aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="搜尋商品名稱、規格或口味" aria-label="搜尋商品名稱、規格或口味"></label>
      <div class="category-select-wrap"><label for="categorySelect">商品分類</label><select id="categorySelect"><option value="全部">全部分類</option></select></div>
    </section>
    <section class="heading" id="productsHeading"><div><span class="section-kicker">FROZEN GOODS</span><h3 id="headingTitle">❄️ 全部現貨</h3><p id="countText">讀取商品中...</p></div><button id="refreshBtn" class="refresh" type="button">↻ 重新整理</button></section>
    <section id="loading" class="state"><div class="spinner"></div><p>正在讀取最新現貨...</p></section>
    <section id="errorState" class="state hidden"><div class="state-icon">⚠️</div><h3>暫時無法讀取商品</h3><p id="errorText">請稍後重新整理。</p><button class="retry" id="retryBtn" type="button">再試一次</button></section>
    <section id="emptyState" class="state hidden"><div class="state-icon">🧊</div><h3>目前沒有符合的商品</h3><p>可以換個分類或搜尋關鍵字看看。</p></section>
    <section id="grid" class="grid hidden" aria-label="商品列表"></section>
  </main>
  <footer>🛍️ 揪愛買｜冷凍現貨專區 <span>商品資訊與庫存依門市現場為主</span></footer>
  <div id="detailModal" class="detail-backdrop hidden" aria-hidden="true">
    <article class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailName">
      <button id="detailCloseBtn" class="detail-close" type="button" aria-label="關閉">×</button>
      <div id="detailMedia" class="detail-media"></div>
      <div class="detail-content"><div class="detail-topline"><span id="detailCategory" class="detail-category"></span><span id="detailStock" class="detail-stock"></span></div>
        <h2 id="detailName" class="detail-name"></h2><div id="detailPrice" class="detail-price"></div>
        <div class="detail-info"><div class="detail-row"><span>規格</span><strong id="detailSpec"></strong></div><div class="detail-row"><span>商品效期</span><strong id="detailExpiry"></strong></div></div>
        <section id="detailVariants" class="detail-variants hidden"><h3>口味／規格選擇</h3><div id="detailVariantList" class="detail-variant-list"></div></section>
        <section class="detail-description-box"><h3>商品介紹</h3><p id="detailDescription"></p></section><p class="detail-note">商品資訊及庫存依門市現場實際狀況為主。</p>
      </div>
    </article>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>window.JOINBUY_CONFIG={supabaseUrl:"https://gwrtxzaqvpawytmftutt.supabase.co",supabaseKey:"sb_publishable_3npPxEjVJEr6zL0DodRoIQ_MTu4TPy0"};</script>
  <script src="app.js"></script>
</body>
</html>
