<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e8">
  <title>揪愛買｜冷凍現貨專區</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">🛒</div>
      <div>
        <h1>揪愛買</h1>
        <p>冷凍現貨專區</p>
      </div>
    </div>
  </header>

  <main class="shell">
    <!-- 後台活動管理會控制此區塊 -->
    <section id="activitySection" class="activity-card hidden">
      <div class="activity-main">
        <span id="activityBadge" class="activity-badge">🎉 最新活動</span>
        <h2 id="activityTitle">揪愛買活動專區</h2>
        <p id="activityDescription"></p>
        <div id="activityPeriod" class="activity-period hidden"></div>
      </div>
      <div class="activity-icon" aria-hidden="true">🎁</div>
    </section>

    <section class="controls">
      <label class="search">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="搜尋商品名稱或口味">
      </label>

      <div class="category-select-wrap">
        <label for="categorySelect">商品分類</label>
        <select id="categorySelect">
          <option value="全部">全部分類</option>
        </select>
      </div>
    </section>

    <section class="heading">
      <div>
        <h3 id="headingTitle">全部現貨</h3>
        <p id="countText">讀取商品中...</p>
      </div>
      <button id="refreshBtn" class="refresh" type="button">重新整理</button>
    </section>

    <section id="loading" class="state">
      <div class="spinner"></div>
      <p>正在讀取最新現貨...</p>
    </section>

    <section id="errorState" class="state hidden">
      <div class="state-icon">⚠️</div>
      <h3>暫時無法讀取商品</h3>
      <p id="errorText">請稍後重新整理。</p>
      <button class="retry" id="retryBtn">再試一次</button>
    </section>

    <section id="emptyState" class="state hidden">
      <div class="state-icon">🧊</div>
      <h3>目前沒有符合的商品</h3>
      <p>可以換個分類或搜尋關鍵字看看。</p>
    </section>

    <section id="grid" class="grid hidden"></section>
  </main>

  <footer>揪愛買｜冷凍現貨專區</footer>

  <div id="detailModal" class="detail-backdrop hidden" aria-hidden="true">
    <article class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailName">
      <button id="detailCloseBtn" class="detail-close" type="button" aria-label="關閉">×</button>
      <div id="detailMedia" class="detail-media"></div>
      <div class="detail-content">
        <div class="detail-topline">
          <span id="detailCategory" class="detail-category"></span>
          <span id="detailStock" class="detail-stock"></span>
        </div>
        <h2 id="detailName" class="detail-name"></h2>
        <div id="detailPrice" class="detail-price"></div>
        <div class="detail-info">
          <div class="detail-row"><span>規格</span><strong id="detailSpec"></strong></div>
          <div class="detail-row"><span>商品效期</span><strong id="detailExpiry"></strong></div>
        </div>
        <section id="detailVariants" class="detail-variants hidden">
          <h3>口味／規格選擇</h3>
          <div id="detailVariantList" class="detail-variant-list"></div>
        </section>
        <section class="detail-description-box">
          <h3>商品介紹</h3>
          <p id="detailDescription"></p>
        </section>
        <p class="detail-note">商品資訊及庫存依門市現場實際狀況為主。</p>
      </div>
    </article>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.JOINBUY_CONFIG = {
      supabaseUrl: "https://gwrtxzaqvpawytmftutt.supabase.co",
      supabaseKey: "sb_publishable_3npPxEjVJEr6zL0DodRoIQ_MTu4TPy0"
    };
  </script>
  <script src="app.js"></script>
</body>
</html>
