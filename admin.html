<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4d2f18">
  <title>揪愛買｜商品管理後台</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#f7f1e8;
      --panel:#fffdf9;
      --line:#e7d8c5;
      --brown:#4d2f18;
      --brown2:#765034;
      --muted:#817367;
      --green:#5e8b45;
      --green-bg:#e8f2df;
      --orange:#c86c29;
      --orange-bg:#fff0df;
      --red:#b84f45;
      --red-bg:#fbe8e5;
      --gray:#777;
      --gray-bg:#efefed;
      --shadow:0 10px 30px rgba(77,47,24,.08);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:linear-gradient(180deg,#fbf8f2,#f7f1e8);
      color:#292019;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    }

    button,input,select,textarea{font:inherit}

    .hidden{display:none!important}

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(255,253,249,.96);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
      padding:12px 14px;
    }

    .top-inner{
      max-width:1100px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo{
      width:44px;
      height:44px;
      border-radius:13px;
      display:grid;
      place-items:center;
      background:var(--brown);
      color:white;
      font-size:22px;
    }

    .brand h1{
      font-size:18px;
      margin:0;
      color:var(--brown);
    }

    .brand p{
      margin:2px 0 0;
      color:var(--muted);
      font-size:11px;
    }

    .shell{
      width:min(1100px,calc(100% - 20px));
      margin:18px auto 50px;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:var(--shadow);
    }

    /* LOGIN */
    .login-wrap{
      min-height:75vh;
      display:grid;
      place-items:center;
    }

    .login-card{
      width:min(430px,100%);
      padding:24px;
    }

    .login-icon{
      width:58px;
      height:58px;
      border-radius:18px;
      background:var(--brown);
      color:#fff;
      display:grid;
      place-items:center;
      font-size:28px;
      margin-bottom:16px;
    }

    .login-card h2{
      margin:0 0 6px;
      font-size:25px;
      color:var(--brown);
    }

    .login-card .sub{
      margin:0 0 22px;
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
    }

    .field{
      margin-bottom:14px;
    }

    .field label{
      display:block;
      font-size:12px;
      font-weight:800;
      color:var(--brown2);
      margin:0 0 6px;
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:12px 13px;
      outline:none;
      color:#292019;
    }

    .field textarea{
      min-height:90px;
      resize:vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus{
      border-color:#a98564;
      box-shadow:0 0 0 3px rgba(169,133,100,.12);
    }

    .primary{
      width:100%;
      border:0;
      border-radius:12px;
      padding:13px 15px;
      background:var(--brown);
      color:white;
      font-weight:800;
      cursor:pointer;
    }

    .primary:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .login-error{
      margin-top:12px;
      padding:10px 12px;
      border-radius:10px;
      background:var(--red-bg);
      color:var(--red);
      font-size:12px;
    }

    /* DASHBOARD */
    .admin-head{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }

    .admin-head h2{
      margin:0;
      color:var(--brown);
      font-size:24px;
    }

    .admin-head p{
      margin:4px 0 0;
      color:var(--muted);
      font-size:12px;
    }

    .head-actions{
      display:flex;
      gap:8px;
    }

    .btn{
      border:1px solid var(--line);
      background:white;
      color:var(--brown2);
      border-radius:11px;
      padding:10px 12px;
      font-weight:800;
      cursor:pointer;
    }

    .btn-add{
      background:var(--brown);
      color:white;
      border-color:var(--brown);
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:9px;
      margin-bottom:14px;
    }

    .summary-card{
      padding:15px;
      border-radius:16px;
      background:var(--panel);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
    }

    .summary-card small{
      color:var(--muted);
      font-size:11px;
    }

    .summary-card strong{
      display:block;
      color:var(--brown);
      font-size:24px;
      margin-top:4px;
    }

    .toolbar{
      padding:12px;
      margin-bottom:12px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .toolbar input,
    .toolbar select{
      border:1px solid var(--line);
      background:white;
      border-radius:11px;
      padding:10px 12px;
      outline:none;
    }

    .toolbar input{
      flex:1 1 220px;
    }

    .toolbar select{
      flex:0 1 180px;
    }

    .table-wrap{
      overflow-x:auto;
      border-radius:18px;
    }

    table{
      width:100%;
      min-width:880px;
      border-collapse:collapse;
      background:var(--panel);
    }

    th,td{
      text-align:left;
      border-bottom:1px solid #eee4d8;
      padding:11px 10px;
      vertical-align:middle;
      font-size:12px;
    }

    th{
      color:var(--brown2);
      font-size:11px;
      background:#f9f4ed;
      white-space:nowrap;
    }

    .product-cell{
      display:flex;
      align-items:center;
      gap:9px;
      min-width:180px;
    }

    .thumb{
      width:56px;
      height:56px;
      border-radius:10px;
      object-fit:cover;
      background:#efe4d5;
      flex:none;
    }

    .thumb-fallback{
      width:56px;
      height:56px;
      border-radius:10px;
      background:#efe4d5;
      display:grid;
      place-items:center;
      font-size:24px;
      flex:none;
    }

    .pname{
      font-weight:800;
      color:#292019;
    }

    .pspec{
      margin-top:3px;
      color:var(--muted);
      font-size:10px;
    }

    .price{
      color:#a94f24;
      font-weight:900;
      white-space:nowrap;
    }

    .badge{
      display:inline-block;
      padding:5px 7px;
      border-radius:8px;
      font-size:10px;
      font-weight:800;
      white-space:nowrap;
    }

    .badge-green{
      color:var(--green);
      background:var(--green-bg);
    }

    .badge-orange{
      color:var(--orange);
      background:var(--orange-bg);
    }

    .badge-gray{
      color:var(--gray);
      background:var(--gray-bg);
    }

    .actions{
      display:flex;
      gap:6px;
      white-space:nowrap;
    }

    .small-btn{
      border:1px solid var(--line);
      background:white;
      border-radius:8px;
      padding:7px 9px;
      font-size:11px;
      font-weight:800;
      cursor:pointer;
    }

    .edit-btn{color:var(--brown)}
    .delete-btn{color:var(--red);border-color:#edc9c5}

    .state{
      padding:55px 20px;
      text-align:center;
      color:var(--muted);
    }

    .state .icon{
      font-size:40px;
      margin-bottom:8px;
    }

    .state h3{
      color:#292019;
      margin:5px 0;
    }

    /* IMAGE UPLOAD */
    .image-upload{
      border:1px dashed #cdb394;
      background:#fbf6ef;
      border-radius:14px;
      padding:12px;
    }

    .image-picker{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .image-file{
      position:absolute;
      width:1px;
      height:1px;
      opacity:0;
      pointer-events:none;
    }

    .image-pick-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--brown);
      border-radius:10px;
      padding:10px 13px;
      font-weight:800;
      cursor:pointer;
    }

    .image-help{
      color:var(--muted);
      font-size:11px;
      line-height:1.5;
      flex:1 1 180px;
    }

    .image-preview-wrap{
      margin-top:11px;
      display:flex;
      align-items:flex-start;
      gap:10px;
    }

    .image-preview{
      width:112px;
      height:112px;
      object-fit:cover;
      border-radius:13px;
      border:1px solid var(--line);
      background:#efe4d5;
    }

    .remove-image-btn{
      border:1px solid #edc9c5;
      background:#fff;
      color:var(--red);
      border-radius:9px;
      padding:8px 10px;
      font-weight:800;
      font-size:11px;
      cursor:pointer;
    }


    /* EXPIRY */
    .expiry-note{
      margin-top:6px;
      font-size:11px;
      color:var(--muted);
    }

    .expiry-badge{
      display:inline-block;
      margin-top:4px;
      padding:4px 7px;
      border-radius:7px;
      font-size:10px;
      font-weight:800;
      white-space:nowrap;
    }

    .expiry-normal{
      background:var(--green-bg);
      color:var(--green);
    }

    .expiry-soon{
      background:var(--orange-bg);
      color:var(--orange);
    }

    .expiry-urgent{
      background:#ffe4d6;
      color:#b84d19;
    }

    .expiry-expired{
      background:var(--red-bg);
      color:var(--red);
    }

    /* MODAL */
    .modal-backdrop{
      position:fixed;
      inset:0;
      z-index:50;
      background:rgba(30,20,14,.42);
      padding:18px 10px;
      overflow:auto;
    }

    .modal{
      width:min(580px,100%);
      margin:20px auto;
      background:var(--panel);
      border-radius:20px;
      border:1px solid var(--line);
      box-shadow:0 20px 60px rgba(0,0,0,.20);
      overflow:hidden;
    }

    .modal-head{
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .modal-head h3{
      margin:0;
      color:var(--brown);
      font-size:19px;
    }

    .close-btn{
      border:0;
      background:transparent;
      font-size:24px;
      color:var(--muted);
      cursor:pointer;
    }

    .modal-body{
      padding:18px;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:11px;
    }

    .modal-footer{
      display:flex;
      gap:8px;
      justify-content:flex-end;
      border-top:1px solid var(--line);
      padding:13px 18px;
    }

    .save-btn{
      border:0;
      border-radius:10px;
      padding:10px 18px;
      color:white;
      background:var(--brown);
      font-weight:800;
    }

    .save-btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .cancel-btn{
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px 18px;
      color:var(--brown2);
      background:white;
      font-weight:800;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:25px;
      z-index:100;
      transform:translateX(-50%);
      width:min(400px,calc(100% - 30px));
      background:#2d241e;
      color:white;
      border-radius:12px;
      padding:12px 15px;
      font-size:12px;
      box-shadow:0 12px 35px rgba(0,0,0,.22);
    }

    /* CATEGORY MANAGEMENT */
    .category-manager{padding:14px;margin-bottom:14px}
    .category-manager-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .category-manager-head h3{margin:0;color:var(--brown);font-size:16px}
    .category-list{display:flex;flex-wrap:wrap;gap:8px}
    .category-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 8px 7px 11px}
    .category-chip-name{font-weight:800;color:var(--brown2);font-size:12px}
    .category-chip button{border:0;background:#f6eee5;border-radius:7px;padding:5px 7px;cursor:pointer;font-weight:800;color:var(--brown2)}
    .category-chip .cat-delete{color:var(--red);background:var(--red-bg)}

    @media(max-width:620px){
      .summary{grid-template-columns:repeat(3,1fr)}
      .summary-card{padding:11px}
      .summary-card strong{font-size:20px}
      .grid2{grid-template-columns:1fr}
      .head-actions{width:100%}
      .head-actions .btn{flex:1}
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="top-inner">
    <div class="brand">
      <div class="logo">🛒</div>
      <div>
        <h1>揪愛買</h1>
        <p>冷凍現貨管理後台</p>
      </div>
    </div>

    <button id="logoutBtn" class="btn hidden">登出</button>
  </div>
</header>

<main class="shell">

  <!-- 登入 -->
  <section id="loginView" class="login-wrap">
    <div class="card login-card">
      <div class="login-icon">🔐</div>

      <h2>店家管理登入</h2>
      <p class="sub">
        此頁僅供揪愛買店家管理使用。<br>
        請輸入管理員帳號與密碼。
      </p>

      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="請輸入管理員 Email"
            required
          >
        </div>

        <div class="field">
          <label>密碼</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="請輸入密碼"
            required
          >
        </div>

        <button id="loginBtn" class="primary" type="submit">
          登入管理後台
        </button>

        <div id="loginError" class="login-error hidden"></div>
      </form>
    </div>
  </section>


  <!-- 管理後台 -->
  <section id="adminView" class="hidden">

    <div class="admin-head">
      <div>
        <h2>商品管理</h2>
        <p id="adminEmail">管理員</p>
      </div>

      <div class="head-actions">
        <button id="refreshBtn" class="btn">重新整理</button>
        <button id="addBtn" class="btn btn-add">＋ 新增商品</button>
      </div>
    </div>

    <div class="card category-manager">
      <div class="category-manager-head">
        <h3>分類管理</h3>
        <button id="addCategoryBtn" class="btn btn-add" type="button">＋ 新增分類</button>
      </div>
      <div id="categoryList" class="category-list"></div>
    </div>

    <div class="summary">
      <div class="summary-card">
        <small>全部商品</small>
        <strong id="totalCount">0</strong>
      </div>

      <div class="summary-card">
        <small>尚有庫存</small>
        <strong id="stockCount">0</strong>
      </div>

      <div class="summary-card">
        <small>已下架</small>
        <strong id="unlistedCount">0</strong>
      </div>
    </div>

    <div class="card toolbar">
      <input id="searchInput" type="search" placeholder="搜尋商品名稱">

      <select id="categoryFilter">
        <option value="">全部分類</option>
      </select>

      <select id="listingFilter">
        <option value="">全部狀態</option>
        <option value="listed">上架中</option>
        <option value="unlisted">已下架</option>
      </select>
    </div>

    <div id="loadingState" class="card state">
      <div class="icon">⏳</div>
      <h3>讀取商品中</h3>
      <p>正在取得最新商品資料...</p>
    </div>

    <div id="emptyState" class="card state hidden">
      <div class="icon">🧊</div>
      <h3>目前沒有商品</h3>
      <p>可以點「新增商品」建立第一筆資料。</p>
    </div>

    <div id="tableWrap" class="card table-wrap hidden">
      <table>
        <thead>
          <tr>
            <th>商品</th>
            <th>分類</th>
            <th>售價</th>
            <th>倉位</th>
            <th>效期</th>
            <th>庫存</th>
            <th>上架狀態</th>
            <th>操作</th>
          </tr>
        </thead>

        <tbody id="productBody"></tbody>
      </table>
    </div>

  </section>

</main>


<!-- 新增／編輯商品 -->
<div id="productModal" class="modal-backdrop hidden">
  <div class="modal">

    <div class="modal-head">
      <h3 id="modalTitle">新增商品</h3>
      <button id="closeModalBtn" class="close-btn">×</button>
    </div>

    <form id="productForm">

      <div class="modal-body">

        <input id="productId" type="hidden">
        <input id="currentImageUrl" type="hidden">

        <div class="field">
          <label>商品名稱 *</label>
          <input id="productName" required placeholder="例如：香酥雞塊">
        </div>

        <div class="grid2">
          <div class="field">
            <label>分類 *</label>
            <select id="productCategory" required>
              <option value="">請選擇</option>
            </select>
            <input
              id="customCategory"
              class="hidden"
              type="text"
              maxlength="30"
              placeholder="輸入新分類名稱，例如：炸物"
              style="margin-top:8px"
            >
          </div>

          <div class="field">
            <label>售價 *</label>
            <input id="productPrice" type="number" min="0" inputmode="numeric" required placeholder="159">
          </div>
        </div>

        <div class="field">
          <label>規格</label>
          <input id="productSpec" placeholder="例如：1kg／包">
        </div>

        <div class="field">
          <label>商品效期</label>
          <input id="expiryDate" type="date">
          <div class="expiry-note">未填可留白；後台會依日期自動顯示到期提醒。</div>
        </div>

        <div class="field">
          <label>倉位 *</label>
          <select id="productWarehouse" required>
            <option value="">請選擇倉位</option>
            <option>冰1-第1袋</option>
            <option>冰1-第2袋</option>
            <option>冰1-第3袋</option>
            <option>冰1-第4袋</option>
            <option>冰1-第5袋</option>
            <option>冰1-第6袋</option>
            <option>冰1-第7袋</option>
            <option>冰1-第8袋</option>
            <option>冰2</option>
            <option>冰3</option>
            <option>冰4</option>
            <option>凍庫</option>
            <option>冷藏</option>
          </select>
        </div>

        <div class="grid2">
          <div class="field">
            <label>庫存狀態 *</label>
            <select id="stockStatus" required>
              <option value="in_stock">尚有庫存</option>
              <option value="sold_out">庫存已售完</option>
            </select>
          </div>

          <div class="field">
            <label>上架狀態 *</label>
            <select id="listingStatus" required>
              <option value="listed">上架</option>
              <option value="unlisted">下架</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>商品圖片</label>

          <div class="image-upload">
            <div class="image-picker">
              <input
                id="imageFile"
                class="image-file"
                type="file"
                accept="image/*"
              >

              <label for="imageFile" class="image-pick-btn">
                📷 選擇商品圖片
              </label>

              <div class="image-help">
                手機可從相簿／拍照選擇，電腦可從資料夾選擇。<br>
                建議使用 JPG、PNG 或 WEBP 圖片。
              </div>
            </div>

            <div id="imagePreviewWrap" class="image-preview-wrap hidden">
              <img id="imagePreview" class="image-preview" alt="商品圖片預覽">

              <button
                id="removeImageBtn"
                class="remove-image-btn"
                type="button"
              >
                移除圖片
              </button>
            </div>
          </div>
        </div>

        <div class="field">
          <label>商品介紹</label>
          <textarea
            id="description"
            placeholder="可輸入商品特色、料理方式等"
          ></textarea>
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" id="cancelModalBtn" class="cancel-btn">
          取消
        </button>

        <button id="saveProductBtn" type="submit" class="save-btn">
          儲存商品
        </button>
      </div>

    </form>
  </div>
</div>

<div id="toast" class="toast hidden"></div>


<script>
  const SUPABASE_URL =
    "https://gwrtxzaqvpawytmftutt.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_3npPxEjVJEr6zL0DodRoIQ_MTu4TPy0";

  const STORAGE_BUCKET = "product-images";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const els = {
    loginView: document.getElementById("loginView"),
    adminView: document.getElementById("adminView"),
    loginForm: document.getElementById("loginForm"),
    email: document.getElementById("email"),
    password: document.getElementById("password"),
    loginBtn: document.getElementById("loginBtn"),
    loginError: document.getElementById("loginError"),
    logoutBtn: document.getElementById("logoutBtn"),

    adminEmail: document.getElementById("adminEmail"),
    refreshBtn: document.getElementById("refreshBtn"),
    addBtn: document.getElementById("addBtn"),
    addCategoryBtn: document.getElementById("addCategoryBtn"),
    categoryList: document.getElementById("categoryList"),

    totalCount: document.getElementById("totalCount"),
    stockCount: document.getElementById("stockCount"),
    unlistedCount: document.getElementById("unlistedCount"),

    searchInput: document.getElementById("searchInput"),
    categoryFilter: document.getElementById("categoryFilter"),
    listingFilter: document.getElementById("listingFilter"),

    loadingState: document.getElementById("loadingState"),
    emptyState: document.getElementById("emptyState"),
    tableWrap: document.getElementById("tableWrap"),
    productBody: document.getElementById("productBody"),

    productModal: document.getElementById("productModal"),
    modalTitle: document.getElementById("modalTitle"),
    closeModalBtn: document.getElementById("closeModalBtn"),
    cancelModalBtn: document.getElementById("cancelModalBtn"),

    productForm: document.getElementById("productForm"),
    productId: document.getElementById("productId"),
    productName: document.getElementById("productName"),
    productCategory: document.getElementById("productCategory"),
    customCategory: document.getElementById("customCategory"),
    productPrice: document.getElementById("productPrice"),
    productSpec: document.getElementById("productSpec"),
    expiryDate: document.getElementById("expiryDate"),
    productWarehouse: document.getElementById("productWarehouse"),
    stockStatus: document.getElementById("stockStatus"),
    listingStatus: document.getElementById("listingStatus"),
    imageFile: document.getElementById("imageFile"),
    currentImageUrl: document.getElementById("currentImageUrl"),
    imagePreviewWrap: document.getElementById("imagePreviewWrap"),
    imagePreview: document.getElementById("imagePreview"),
    removeImageBtn: document.getElementById("removeImageBtn"),
    description: document.getElementById("description"),
    saveProductBtn: document.getElementById("saveProductBtn"),

    toast: document.getElementById("toast")
  };

  let products = [];
  let categories = [];
  let previewObjectUrl = "";
  let imageMarkedForRemoval = false;

  const emojiMap = {
    "肉品": "🥩",
    "海鮮": "🦐",
    "火鍋料": "🍲",
    "早餐／麵食": "🥞",
    "點心／甜點": "🍗",
    "其他": "❄️"
  };

  function escapeHtml(value = "") {
    return String(value).replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );
  }

  function toast(message) {
    els.toast.textContent = message;
    els.toast.classList.remove("hidden");

    clearTimeout(window.__toastTimer);

    window.__toastTimer = setTimeout(() => {
      els.toast.classList.add("hidden");
    }, 2500);
  }

  function showLogin() {
    els.loginView.classList.remove("hidden");
    els.adminView.classList.add("hidden");
    els.logoutBtn.classList.add("hidden");
  }

  function showAdmin(user) {
    els.loginView.classList.add("hidden");
    els.adminView.classList.remove("hidden");
    els.logoutBtn.classList.remove("hidden");

    els.adminEmail.textContent =
      user?.email
        ? "登入帳號：" + user.email
        : "管理員";

    loadAllData();
  }

  async function checkSession() {
    const {
      data: { session }
    } = await db.auth.getSession();

    if (session?.user) {
      showAdmin(session.user);
    } else {
      showLogin();
    }
  }

  els.loginForm.addEventListener(
    "submit",
    async event => {
      event.preventDefault();

      els.loginBtn.disabled = true;
      els.loginBtn.textContent = "登入中...";
      els.loginError.classList.add("hidden");

      const email = els.email.value.trim();
      const password = els.password.value;

      const {
        data,
        error
      } = await db.auth.signInWithPassword({
        email,
        password
      });

      els.loginBtn.disabled = false;
      els.loginBtn.textContent = "登入管理後台";

      if (error) {
        els.loginError.textContent =
          "登入失敗：" + error.message;

        els.loginError.classList.remove("hidden");
        return;
      }

      els.password.value = "";

      showAdmin(data.user);
    }
  );

  els.logoutBtn.addEventListener(
    "click",
    async () => {
      await db.auth.signOut();

      products = [];
      categories = [];
      els.productBody.innerHTML = "";

      showLogin();

      toast("已登出管理後台");
    }
  );

  async function loadAllData() {
    els.loadingState.classList.remove("hidden");
    els.emptyState.classList.add("hidden");
    els.tableWrap.classList.add("hidden");

    const [categoryResult, productResult] = await Promise.all([
      db
        .from("categories")
        .select("id,name,sort_order,created_at")
        .order("sort_order", { ascending:true })
        .order("id", { ascending:true }),
      db
        .from("products")
        .select("*")
        .order("created_at", { ascending:false })
    ]);

    els.loadingState.classList.add("hidden");

    if (categoryResult.error) {
      toast("讀取分類失敗：" + categoryResult.error.message);
      return;
    }

    if (productResult.error) {
      toast("讀取商品失敗：" + productResult.error.message);
      return;
    }

    categories = (categoryResult.data || [])
      .filter(item => String(item.name || "").trim())
      .map(item => ({
        ...item,
        name:String(item.name).trim(),
        sort_order:Number(item.sort_order || 0)
      }));

    products = productResult.data || [];

    renderCategoryManager();
    buildCategoryFilter();
    buildProductCategoryOptions();
    updateSummary();
    renderProducts();
  }

  async function loadProducts() {
    return loadAllData();
  }

  function getAllCategories() {
    const names = [];

    categories.forEach(item => {
      if (item.name && !names.includes(item.name)) names.push(item.name);
    });

    products.forEach(product => {
      const name = String(product.category || "").trim();
      if (name && !names.includes(name)) names.push(name);
    });

    return names;
  }

  function findCategoryRecord(name) {
    return categories.find(item => item.name === name) || null;
  }

  function renderCategoryManager() {
    const names = getAllCategories();

    if (!names.length) {
      els.categoryList.innerHTML = '<span style="color:var(--muted);font-size:12px">目前尚未建立分類</span>';
      return;
    }

    els.categoryList.innerHTML = names.map((name, index) => {
      const record = findCategoryRecord(name);
      const canMoveUp = !!record && index > 0;
      const canMoveDown = !!record && index < categories.length - 1;

      return `
        <div class="category-chip">
          <span class="category-chip-name">${escapeHtml(name)}</span>
          ${record ? `<button type="button" title="往前" ${canMoveUp ? "" : "disabled"} onclick='moveCategory(${record.id},-1)'>↑</button>` : ""}
          ${record ? `<button type="button" title="往後" ${canMoveDown ? "" : "disabled"} onclick='moveCategory(${record.id},1)'>↓</button>` : ""}
          <button type="button" onclick='renameCategory(${JSON.stringify(name)})'>修改</button>
          <button type="button" class="cat-delete" onclick='deleteCategory(${JSON.stringify(name)})'>刪除</button>
        </div>
      `;
    }).join("");
  }

  function refreshCategoryUI() {
    renderCategoryManager();
    buildCategoryFilter();
    buildProductCategoryOptions();
    renderProducts();
  }

  async function addCategory() {
    const name = (prompt("請輸入新的分類名稱：") || "").trim();
    if (!name) return;

    if (getAllCategories().includes(name)) {
      toast("這個分類已經存在");
      return;
    }

    const nextOrder = categories.length
      ? Math.max(...categories.map(item => Number(item.sort_order || 0))) + 1
      : 1;

    const { error } = await db
      .from("categories")
      .insert({ name, sort_order:nextOrder });

    if (error) {
      toast("新增分類失敗：" + error.message);
      return;
    }

    toast(`已新增分類「${name}」`);
    await loadAllData();
  }

  window.renameCategory = async function(oldName) {
    const newName = (prompt("修改分類名稱：", oldName) || "").trim();
    if (!newName || newName === oldName) return;

    if (getAllCategories().includes(newName)) {
      toast("這個分類名稱已經存在");
      return;
    }

    const affected = products.filter(p => p.category === oldName).length;
    if (affected && !confirm(`目前有 ${affected} 項商品使用「${oldName}」。\n\n修改後，這些商品會一起改成「${newName}」。確定嗎？`)) return;

    const record = findCategoryRecord(oldName);

    if (record) {
      const { error } = await db
        .from("categories")
        .update({ name:newName })
        .eq("id", record.id);

      if (error) {
        toast("修改分類失敗：" + error.message);
        return;
      }
    } else {
      const nextOrder = categories.length
        ? Math.max(...categories.map(item => Number(item.sort_order || 0))) + 1
        : 1;

      const { error } = await db
        .from("categories")
        .insert({ name:newName, sort_order:nextOrder });

      if (error) {
        toast("建立分類失敗：" + error.message);
        return;
      }
    }

    if (affected) {
      const { error } = await db
        .from("products")
        .update({ category:newName })
        .eq("category", oldName);

      if (error) {
        toast("商品分類同步失敗：" + error.message);
        return;
      }
    }

    toast("分類修改完成");
    await loadAllData();
  };

  window.deleteCategory = async function(name) {
    const affected = products.filter(p => p.category === name).length;

    if (affected) {
      alert(`「${name}」目前還有 ${affected} 項商品使用中。\n\n請先把這些商品改到其他分類，再刪除這個分類。`);
      return;
    }

    if (!confirm(`確定要刪除分類「${name}」嗎？`)) return;

    const record = findCategoryRecord(name);

    if (!record) {
      toast("這個分類目前只存在於舊商品資料，沒有可刪除的分類記錄");
      return;
    }

    const { error } = await db
      .from("categories")
      .delete()
      .eq("id", record.id);

    if (error) {
      toast("刪除分類失敗：" + error.message);
      return;
    }

    toast("分類已刪除");
    await loadAllData();
  };

  window.moveCategory = async function(id, direction) {
    const currentIndex = categories.findIndex(item => item.id === id);
    if (currentIndex < 0) return;

    const targetIndex = currentIndex + direction;
    if (targetIndex < 0 || targetIndex >= categories.length) return;

    const current = categories[currentIndex];
    const target = categories[targetIndex];

    let currentOrder = Number(current.sort_order || currentIndex + 1);
    let targetOrder = Number(target.sort_order || targetIndex + 1);

    if (currentOrder === targetOrder) {
      currentOrder = currentIndex + 1;
      targetOrder = targetIndex + 1;
    }

    const [a, b] = await Promise.all([
      db.from("categories").update({ sort_order:targetOrder }).eq("id", current.id),
      db.from("categories").update({ sort_order:currentOrder }).eq("id", target.id)
    ]);

    if (a.error || b.error) {
      toast("調整分類順序失敗：" + (a.error?.message || b.error?.message || "未知錯誤"));
      return;
    }

    await loadAllData();
  };

  function buildProductCategoryOptions(selected = "") {
    const names = getAllCategories();

    els.productCategory.innerHTML =
      '<option value="">請選擇</option>';

    names.forEach(category => {
      const option = document.createElement("option");
      option.value = category;
      option.textContent = category;
      els.productCategory.appendChild(option);
    });

    const addOption = document.createElement("option");
    addOption.value = "__new__";
    addOption.textContent = "＋ 新增分類";
    els.productCategory.appendChild(addOption);

    if (selected && names.includes(selected)) {
      els.productCategory.value = selected;
    }
  }

  function syncCustomCategoryField() {
    const isNew = els.productCategory.value === "__new__";
    els.customCategory.classList.toggle("hidden", !isNew);
    els.customCategory.required = isNew;

    if (isNew) {
      setTimeout(() => els.customCategory.focus(), 0);
    } else {
      els.customCategory.value = "";
    }
  }

  function buildCategoryFilter() {
    const current = els.categoryFilter.value;
    const names = getAllCategories();

    els.categoryFilter.innerHTML =
      '<option value="">全部分類</option>';

    names.forEach(category => {
      const option = document.createElement("option");
      option.value = category;
      option.textContent = category;
      els.categoryFilter.appendChild(option);
    });

    if (names.includes(current)) {
      els.categoryFilter.value = current;
    }
  }

  function updateSummary() {
    els.totalCount.textContent =
      products.length;

    els.stockCount.textContent =
      products.filter(
        p => p.stock_status === "in_stock"
      ).length;

    els.unlistedCount.textContent =
      products.filter(
        p => p.listing_status === "unlisted"
      ).length;
  }

  function getFilteredProducts() {
    const search =
      els.searchInput.value
        .trim()
        .toLowerCase();

    const category =
      els.categoryFilter.value;

    const listing =
      els.listingFilter.value;

    return products.filter(product => {
      const matchesSearch =
        !search ||
        String(product.name || "")
          .toLowerCase()
          .includes(search) ||
        String(product.spec || "")
          .toLowerCase()
          .includes(search);

      const matchesCategory =
        !category ||
        product.category === category;

      const matchesListing =
        !listing ||
        product.listing_status === listing;

      return (
        matchesSearch &&
        matchesCategory &&
        matchesListing
      );
    });
  }


  function parseDateOnly(value) {
    if (!value) return null;
    const [y,m,d] = value.split("-").map(Number);
    if (!y || !m || !d) return null;
    return new Date(y, m - 1, d);
  }

  function formatDateOnly(value) {
    const date = parseDateOnly(value);
    if (!date) return "—";
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}/${m}/${d}`;
  }

  function getExpiryInfo(value) {
    const expiry = parseDateOnly(value);
    if (!expiry) return { text:"未設定", cls:"expiry-normal", days:null };

    const today = new Date();
    const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const diff = Math.ceil((expiry - todayOnly) / 86400000);

    if (diff < 0) return { text:"已過效期", cls:"expiry-expired", days:diff };
    if (diff <= 7) return { text:`${diff === 0 ? "今日到期" : `剩 ${diff} 天`}・優先出清`, cls:"expiry-urgent", days:diff };
    if (diff <= 30) return { text:`即將到期・剩 ${diff} 天`, cls:"expiry-soon", days:diff };
    return { text:"效期正常", cls:"expiry-normal", days:diff };
  }

  function renderProducts() {
    const list =
      getFilteredProducts();

    if (!list.length) {
      els.tableWrap.classList.add("hidden");
      els.emptyState.classList.remove("hidden");
      return;
    }

    els.emptyState.classList.add("hidden");
    els.tableWrap.classList.remove("hidden");

    els.productBody.innerHTML =
      list.map(product => {

        const image =
          product.image_url
            ? `
              <img
                class="thumb"
                src="${escapeHtml(product.image_url)}"
                alt="${escapeHtml(product.name)}"
              >
            `
            : `
              <div class="thumb-fallback">
                ${emojiMap[product.category] || "❄️"}
              </div>
            `;

        const stock =
          product.stock_status === "sold_out"
            ? `<span class="badge badge-orange">庫存已售完</span>`
            : `<span class="badge badge-green">尚有庫存</span>`;

        const listing =
          product.listing_status === "unlisted"
            ? `<span class="badge badge-gray">已下架</span>`
            : `<span class="badge badge-green">上架中</span>`;

        return `
          <tr>

            <td>
              <div class="product-cell">
                ${image}

                <div>
                  <div class="pname">
                    ${escapeHtml(product.name || "")}
                  </div>

                  <div class="pspec">
                    ${escapeHtml(product.spec || "")}
                  </div>
                </div>
              </div>
            </td>

            <td>
              ${escapeHtml(product.category || "")}
            </td>

            <td class="price">
              $${Number(product.price || 0).toLocaleString()}
            </td>

            <td>
              ${escapeHtml(product.warehouse || "")}
            </td>

            <td>
              <div>${formatDateOnly(product.expiry_date)}</div>
              <span class="expiry-badge ${getExpiryInfo(product.expiry_date).cls}">
                ${getExpiryInfo(product.expiry_date).text}
              </span>
            </td>

            <td>${stock}</td>

            <td>${listing}</td>

            <td>
              <div class="actions">

                <button
                  class="small-btn edit-btn"
                  onclick="editProduct(${product.id})"
                >
                  編輯
                </button>

                <button
                  class="small-btn delete-btn"
                  onclick="deleteProduct(${product.id})"
                >
                  刪除
                </button>

              </div>
            </td>

          </tr>
        `;
      }).join("");
  }

  function clearPreviewObjectUrl() {
    if (previewObjectUrl) {
      URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl = "";
    }
  }

  function hideImagePreview() {
    clearPreviewObjectUrl();
    els.imagePreview.removeAttribute("src");
    els.imagePreviewWrap.classList.add("hidden");
  }

  function showImagePreview(src) {
    els.imagePreview.src = src;
    els.imagePreviewWrap.classList.remove("hidden");
  }

  function resetImageField() {
    clearPreviewObjectUrl();
    els.imageFile.value = "";
    els.currentImageUrl.value = "";
    imageMarkedForRemoval = false;
    hideImagePreview();
  }

  function openAddModal() {
    els.modalTitle.textContent =
      "新增商品";

    els.productForm.reset();

    els.productId.value = "";

    buildProductCategoryOptions();
    els.customCategory.value = "";
    els.customCategory.classList.add("hidden");
    els.customCategory.required = false;

    els.stockStatus.value =
      "in_stock";

    els.listingStatus.value =
      "listed";

    resetImageField();

    els.productModal.classList.remove(
      "hidden"
    );
  }

  function closeModal() {
    clearPreviewObjectUrl();

    els.productModal.classList.add(
      "hidden"
    );
  }

  window.editProduct = function(id) {
    const product =
      products.find(
        item => item.id === id
      );

    if (!product) return;

    els.modalTitle.textContent =
      "編輯商品";

    els.productId.value =
      product.id;

    els.productName.value =
      product.name || "";

    buildProductCategoryOptions(product.category || "");
    els.customCategory.value = "";
    els.customCategory.classList.add("hidden");
    els.customCategory.required = false;

    els.productPrice.value =
      product.price ?? 0;

    els.productSpec.value =
      product.spec || "";

    els.expiryDate.value =
      product.expiry_date || "";

    els.productWarehouse.value =
      product.warehouse || "";

    els.stockStatus.value =
      product.stock_status || "in_stock";

    els.listingStatus.value =
      product.listing_status || "listed";

    els.imageFile.value = "";
    els.currentImageUrl.value =
      product.image_url || "";

    imageMarkedForRemoval = false;
    clearPreviewObjectUrl();

    if (product.image_url) {
      showImagePreview(product.image_url);
    } else {
      hideImagePreview();
    }

    els.description.value =
      product.description || "";

    els.productModal.classList.remove(
      "hidden"
    );
  };

  function getStoragePathFromPublicUrl(url) {
    if (!url) return null;

    const marker =
      `/storage/v1/object/public/${STORAGE_BUCKET}/`;

    const index =
      url.indexOf(marker);

    if (index === -1) return null;

    return decodeURIComponent(
      url.slice(index + marker.length)
    );
  }

  async function removeStorageImageByUrl(url) {
    const path =
      getStoragePathFromPublicUrl(url);

    if (!path) return;

    const {
      error
    } = await db.storage
      .from(STORAGE_BUCKET)
      .remove([path]);

    if (error) {
      console.warn(
        "刪除舊圖片失敗：",
        error.message
      );
    }
  }

  function makeUploadPath(file) {
    const originalName =
      file.name || "image.jpg";

    const extension =
      (originalName.split(".").pop() || "jpg")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "") || "jpg";

    const randomPart =
      (window.crypto?.randomUUID?.() ||
        Math.random().toString(36).slice(2))
        .replace(/-/g, "");

    return `products/${Date.now()}-${randomPart}.${extension}`;
  }

  async function uploadProductImage(file) {
    if (!file) return null;

    if (!file.type.startsWith("image/")) {
      throw new Error("請選擇圖片檔案");
    }

    const path =
      makeUploadPath(file);

    const {
      error: uploadError
    } = await db.storage
      .from(STORAGE_BUCKET)
      .upload(path, file, {
        cacheControl:"3600",
        upsert:false,
        contentType:file.type || undefined
      });

    if (uploadError) {
      throw uploadError;
    }

    const {
      data
    } = db.storage
      .from(STORAGE_BUCKET)
      .getPublicUrl(path);

    if (!data?.publicUrl) {
      await db.storage
        .from(STORAGE_BUCKET)
        .remove([path]);

      throw new Error(
        "圖片網址建立失敗"
      );
    }

    return {
      path,
      publicUrl:data.publicUrl
    };
  }

  els.imageFile.addEventListener(
    "change",
    () => {
      const file =
        els.imageFile.files?.[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        els.imageFile.value = "";
        toast("請選擇圖片檔案");
        return;
      }

      clearPreviewObjectUrl();

      previewObjectUrl =
        URL.createObjectURL(file);

      showImagePreview(previewObjectUrl);

      imageMarkedForRemoval = false;
    }
  );

  els.removeImageBtn.addEventListener(
    "click",
    () => {
      els.imageFile.value = "";
      imageMarkedForRemoval = true;
      hideImagePreview();
    }
  );

  window.deleteProduct =
    async function(id) {

      const product =
        products.find(
          item => item.id === id
        );

      if (!product) return;

      const confirmed =
        confirm(
          `確定要刪除「${product.name}」嗎？\n\n刪除後無法復原。`
        );

      if (!confirmed) return;

      const {
        error
      } = await db
        .from("products")
        .delete()
        .eq("id", id);

      if (error) {
        toast(
          "刪除失敗：" +
          error.message
        );
        return;
      }

      if (product.image_url) {
        await removeStorageImageByUrl(
          product.image_url
        );
      }

      toast("商品已刪除");

      await loadProducts();
    };

  els.productForm.addEventListener(
    "submit",
    async event => {
      event.preventDefault();

      els.saveProductBtn.disabled = true;
      els.saveProductBtn.textContent =
        "儲存中...";

      const id =
        els.productId.value;

      const oldImageUrl =
        els.currentImageUrl.value.trim();

      const selectedFile =
        els.imageFile.files?.[0] || null;

      let newUpload = null;
      let finalImageUrl =
        imageMarkedForRemoval
          ? null
          : (oldImageUrl || null);

      try {
        if (selectedFile) {
          els.saveProductBtn.textContent =
            "上傳圖片中...";

          newUpload =
            await uploadProductImage(
              selectedFile
            );

          finalImageUrl =
            newUpload.publicUrl;
        }

        els.saveProductBtn.textContent =
          "儲存商品中...";

        const selectedCategory =
          els.productCategory.value === "__new__"
            ? els.customCategory.value.trim()
            : els.productCategory.value;

        if (!selectedCategory) {
          throw new Error("請選擇或輸入商品分類");
        }

        if (els.productCategory.value === "__new__") {
          if (getAllCategories().includes(selectedCategory)) {
            throw new Error("這個分類已經存在，請直接從分類選單選擇");
          }

          const nextOrder = categories.length
            ? Math.max(...categories.map(item => Number(item.sort_order || 0))) + 1
            : 1;

          const { error: categoryError } = await db
            .from("categories")
            .insert({ name:selectedCategory, sort_order:nextOrder });

          if (categoryError) throw categoryError;
        }

        const payload = {
          name:
            els.productName.value.trim(),

          category:
            selectedCategory,

          price:
            Number(
              els.productPrice.value || 0
            ),

          spec:
            els.productSpec.value.trim() || null,

          expiry_date:
            els.expiryDate.value || null,

          warehouse:
            els.productWarehouse.value,

          stock_status:
            els.stockStatus.value,

          listing_status:
            els.listingStatus.value,

          image_url:
            finalImageUrl,

          description:
            els.description.value.trim() || null
        };

        let error;

        if (id) {
          ({
            error
          } = await db
            .from("products")
            .update(payload)
            .eq("id", Number(id)));
        } else {
          ({
            error
          } = await db
            .from("products")
            .insert(payload));
        }

        if (error) {
          if (newUpload?.path) {
            await db.storage
              .from(STORAGE_BUCKET)
              .remove([newUpload.path]);
          }

          throw error;
        }

        const oldImageShouldBeDeleted =
          oldImageUrl &&
          (
            imageMarkedForRemoval ||
            (
              newUpload?.publicUrl &&
              newUpload.publicUrl !== oldImageUrl
            )
          );

        if (oldImageShouldBeDeleted) {
          await removeStorageImageByUrl(
            oldImageUrl
          );
        }

        closeModal();

        toast(
          id
            ? "商品修改完成"
            : "商品新增完成"
        );

        await loadProducts();

      } catch (error) {
        toast(
          "儲存失敗：" +
          (error?.message || "未知錯誤")
        );
      } finally {
        els.saveProductBtn.disabled = false;
        els.saveProductBtn.textContent =
          "儲存商品";
      }
    }
  );

  els.productCategory.addEventListener(
    "change",
    syncCustomCategoryField
  );

  els.addCategoryBtn.addEventListener("click", addCategory);

  els.addBtn.addEventListener(
    "click",
    openAddModal
  );

  els.refreshBtn.addEventListener(
    "click",
    loadProducts
  );

  els.closeModalBtn.addEventListener(
    "click",
    closeModal
  );

  els.cancelModalBtn.addEventListener(
    "click",
    closeModal
  );

  els.productModal.addEventListener(
    "click",
    event => {
      if (
        event.target ===
        els.productModal
      ) {
        closeModal();
      }
    }
  );

  els.searchInput.addEventListener(
    "input",
    renderProducts
  );

  els.categoryFilter.addEventListener(
    "change",
    renderProducts
  );

  els.listingFilter.addEventListener(
    "change",
    renderProducts
  );

  db.auth.onAuthStateChange(
    (_event, session) => {
      if (session?.user) {
        showAdmin(session.user);
      }
    }
  );

  checkSession();
</script>

</body>
</html>
